[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recollect"
version = "0.1.0"
description = "Recollect - v1 observation layer backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["core*", "app*", "adapters*", "edge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
