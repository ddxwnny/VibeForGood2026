[project]
name = "recollect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "pydantic-settings>=2.0",
    "sqlalchemy==2.0.52",
    "uuid7>=0.1.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recollect"]
